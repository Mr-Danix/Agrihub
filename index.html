<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>AgriHub | Home</title><link rel="stylesheet" href="style.css">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-image: url('bg.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        .panel { 
         
            padding: 30px; 
            border-radius: 160px; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        .btn-main {
        border-radius: 160px; 
    }
         .profile-pic{
    text-align:center;
    margin-bottom:25px;
}

.profile-pic img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #fff;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

.profile-pic img:hover{
    transform:scale(1.05);
}

.profile-pic input{
    display:none;
}
/* QR Code Container */
.qr-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    z-index: 1000;
    text-align: center;
}

.qr-container:hover {
    transform: scale(1.1);
    border-color: #2ecc71; /* AgriHub Green */
}

.qr-container img {
    width: 100px;  /* Adjust size as needed */
    height: 110px;
    display: block;
    border-radius: 8px;
}

.qr-container span {
    color: white;
    font-size: 0.7rem;
    display: block;
    margin-top: 5px;
    font-weight: 600;
}

/* Hide on very small screens to save space */
@media (max-width: 480px) {
    .qr-container {
        bottom: 10px;
        right: 10px;
        transform: scale(0.8);
    }
}
    </style>
</head>
<body>
    <header>
        <div class="logo">AgriHub</div>
       <div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,am,om,ti,so,aa',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


    </header>
     <main class="wrap">
        <div class="panel fade-in" style="text-align:center; padding:80px 20px;">
            <h1 style="font-size:2.5rem">Ethiopia's Digital Harvest</h1>
            <p style="margin:20px 0; max-width:600px; margin-inline:auto;">Before we start our business lets take a tutorial to get familiar with our platform.</p>
            <button class="btn-main" style="width:auto" onclick="window.location.href='about.html'">About us</button>
            
        </div>
    </main>
    
    <div class="chat-launcher" onclick="toggleChat()">
    💬
</div>

<div id="chatWidget">
    <div class="widget-header">
        <span>AgriHub Assistant</span>
        <span onclick="toggleChat()" style="cursor:pointer">✕</span>
    </div>
    <iframe src="chatbot.html" id="chatFrame"></iframe>
</div>
<div class="qr-container">
    <img src="agri hub.png" alt="Scan to Join">
    <span>Scan Me</span>
</div>
<script>
function toggleChat() {
    const widget = document.getElementById('chatWidget');
    if (widget.style.display === 'none' || widget.style.display === '') {
        widget.style.display = 'block';
        widget.classList.add('fade-in'); // Reuse your existing animation
    } else {
        widget.style.display = 'none';
    }
}
</script>
    <script>
        function showLogout() {
    var box = document.getElementById("logoutBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
}

function logout() {
    // Redirect to sign in page
    window.location.href = "auth.html"; 
}
    </script>
    <script src="script.js"></script>
</body>
</html>
