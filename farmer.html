<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>AgriHub | Home</title><link rel="stylesheet" href="style2.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .panel {
        border-radius: 160px; 
    }
    .btn-main {
        border-radius: 160px; 
    }
   /* QR Code Container */
.qr-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    z-index: 1000;
    text-align: center;
}

.qr-container:hover {
    transform: scale(1.1);
    border-color: #2ecc71; /* AgriHub Green */
}

.qr-container img {
    width: 100px;  /* Adjust size as needed */
    height: 110px;
    display: block;
    border-radius: 8px;
}

.qr-container span {
    color: white;
    font-size: 0.7rem;
    display: block;
    margin-top: 5px;
    font-weight: 600;
}

/* Hide on very small screens to save space */
@media (max-width: 480px) {
    .qr-container {
        bottom: 10px;
        right: 10px;
        transform: scale(0.8);
    }
}
    </style>
</head>
<body>
    <header>
        <div class="logo">AgriHub</div>
        <nav>
            <a href="farmer.html" class="nav-btn ">Home</a>
            <a href="sell.html" class="nav-btn">Sell</a>
            
            <a href="contact2.html" class="nav-btn">Contact</a>
            <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:1.2rem">🌓</button>
            <div class="profile-pic" onclick="showLogout()">
    <a href="#" class="nav-btn ">Logout</a>
    </div>
    <div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,am,om,ti,so,aa',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


<!-- Logout Popup -->
<div id="logoutBox" style="display:none; position:absolute; top:120px; right:20px; background:#fff; padding:10px; border:1px solid #ccc; border-radius:5px;">
    <button class="btn-main" onclick="logout()">Logout as A Farmer</button>
</div>
        </nav>
    </header>
    <main class="wrap">
        <div class="panel fade-in" style="text-align:center; padding:80px 20px;">
            <h1 style="font-size:2.5rem">Ethiopia's Digital Harvest</h1>
            <p style="margin:20px 0; max-width:600px; margin-inline:auto; "><strong><b>  Connect directly with local Buyers.</b></strong></p>
            <button class="btn-main" style="width:auto" onclick="window.location.href='sell.html'">Start Selling!</button>
        </div>
    </main>
    <div class="chat-launcher" onclick="toggleChat()">
    💬
</div>

<div id="chatWidget">
    <div class="widget-header">
        <span>AgriHub Assistant</span>
        <span onclick="toggleChat()" style="cursor:pointer">✕</span>
    </div>
    <iframe src="chatbot.html" id="chatFrame"></iframe>
</div>
<div class="qr-container">
    <img src="agri hub.png" alt="Scan to Join">
    <span>Scan Me</span>
</div>
<script>
function toggleChat() {
    const widget = document.getElementById('chatWidget');
    if (widget.style.display === 'none' || widget.style.display === '') {
        widget.style.display = 'block';
        widget.classList.add('fade-in'); // Reuse your existing animation
    } else {
        widget.style.display = 'none';
    }
}
</script>
    <script>
        
      function showLogout() {
    var box = document.getElementById("logoutBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
}
document.addEventListener('DOMContentLoaded', () => {
    const savedImage = localStorage.getItem('userPFP');
    const preview = document.getElementById("preview");
    
    // If a picture was saved in localStorage, display it
    if (savedImage && preview) {
        preview.src = savedImage;
    }
});
function logout() {
    // This line specifically deletes the saved photo from the browser's memory
    localStorage.removeItem('userPFP'); 
    
    // Then move to the index/login page
    window.location.href = "index.html";
}

function logout() {
    // Redirect to sign in page
    window.location.href = "auth.html"; 
}
    
    </script>
    <script src="script.js"></script>
</body>
</html>
