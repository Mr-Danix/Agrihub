<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
    <title>Select Account</title>
    <link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
   .panel { 
    /* 1. Use RGBA for transparency so text stays readable */
    background: rgba(255, 255, 255, 0.1); 
    
    /* 2. Add the blur effect (Glassmorphism) */
    backdrop-filter: blur(2000px) saturate(150%);
    -webkit-backdrop-filter: blur(200px) saturate(150%); /* For Safari support */

    padding: 25px; 
    border-radius: 160px; 
    
    /* 3. Make the border slightly transparent too */
    border: 1px solid rgba(255, 255, 255, 0.1); 
    box-shadow: var(--glow);
    transition: all 0.3s ease; /* Makes the hover effect smooth */
}
    .grid { 
    /* 1. Use RGBA for transparency so text stays readable */
    background: rgba(255, 255, 255, 0.1); 
    
    /* 2. Add the blur effect (Glassmorphism) */
    backdrop-filter: blur(500px) saturate(150%);
    -webkit-backdrop-filter: blur(1000px) saturate(150%); /* For Safari support */

    padding: 25px; 
    border-radius: 120px; 
    
    /* 3. Make the border slightly transparent too */
    border: 1px solid rgba(255, 255, 255, 0.1); 
    box-shadow: var(--glow);
    transition: all 0.3s ease; /* Makes the hover effect smooth */
}
    .qr-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    z-index: 1000;
    text-align: center;
}

.qr-container:hover {
    transform: scale(1.1);
    border-color: #2ecc71; /* AgriHub Green */
}

.qr-container img {
    width: 100px;  /* Adjust size as needed */
    height: 110px;
    display: block;
    border-radius: 8px;
}

.qr-container span {
    color: white;
    font-size: 0.7rem;
    display: block;
    margin-top: 5px;
    font-weight: 600;
}

/* Hide on very small screens to save space */
@media (max-width: 480px) {
    .qr-container {
        bottom: 10px;
        right: 10px;
        transform: scale(0.8);
    }
}
</style></head>
<body>
    
    <div class="wrap fade-in" style="text-align:center; padding-top:100px;">
        <div id="google_translate_element"></div>
        

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,am,om,ti,so,aa',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
       <main class="wrap"> 
<h1>Who are you today?</h1>
        <div class="grid" style="margin-top:40px;">
            <div class="panel" onclick="window.location.href='farmer.html'" style="cursor:pointer">
                <span style="font-size:3rem">🚜</span><h2>Farmer</h2><p>I want to sell my products</p>
            </div>
            <div class="panel" onclick="window.location.href='home.html'" style="cursor:pointer">
                <span style="font-size:3rem">🛍️</span><h2>Buyer</h2><p>I want to shop fresh goods</p>
            </div>
        </div>
    </div>
    
</main>
    
</body>
</html>
