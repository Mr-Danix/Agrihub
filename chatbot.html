<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub AI | Smart Assistant</title>
    <style>
        :root { --green: #2e7d32; --glass: rgba(255, 255, 255, 0.2); }
        
        body { 
            margin: 0; height: 100vh; 
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        /* Glassmorphism Container */
        .chat-container {
            width: 380px; height: 550px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: floatUp 1s ease-out;
        }

        @keyframes floatUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .header { background: rgba(255,255,255,0.1); padding: 20px; text-align: center; color: white; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.2); position: relative; }

        .back-btn { 
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 5px 10px; border-radius: 15px; cursor: pointer; font-size: 12px;
            transition: 0.3s ease;
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Message Animations */
        .bubble { 
            padding: 12px 18px; border-radius: 20px; max-width: 80%; 
            font-size: 14px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .bot { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--green); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .input-area { padding: 20px; display: flex; gap: 10px; }
        input { 
            flex: 1; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            padding: 12px; border-radius: 25px; color: white; outline: none;
        }
        input::placeholder { color: rgba(255,255,255,0.7); }
        
        button { 
            background: white; color: var(--green); border: none; 
            padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold;
            transition: 0.3s ease;
        }
        button:hover { transform: scale(1.1); background: var(--green); color: white; }
    </style>
    
    <style>
        /* Responsive Design for Mobile and Tablet */
        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                margin: 10px auto;
                border-radius: 15px;
            }
            
            .header {
                padding: 15px;
                font-size: 1.2em;
            }
            
            .back-btn {
                padding: 8px 12px;
                font-size: 0.9em;
            }
            
            .chat-messages {
                height: calc(100vh - 200px);
                padding: 15px;
            }
            
            .message {
                font-size: 0.9em;
                margin-bottom: 12px;
                padding: 10px 15px;
            }
            
            .input-area {
                padding: 15px;
                gap: 10px;
            }
            
            .input-area input {
                flex: 1;
                padding: 12px 15px;
                font-size: 1em;
                border-radius: 20px;
            }
            
            .input-area button {
                padding: 12px 20px;
                font-size: 0.9em;
                border-radius: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .chat-container {
                width: 98%;
                height: 98vh;
                margin: 5px auto;
                border-radius: 10px;
            }
            
            .header {
                padding: 12px;
                font-size: 1.1em;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .back-btn {
                align-self: flex-start;
                padding: 6px 10px;
                font-size: 0.8em;
            }
            
            .chat-messages {
                height: calc(100vh - 180px);
                padding: 10px;
            }
            
            .message {
                font-size: 0.85em;
                margin-bottom: 10px;
                padding: 8px 12px;
                max-width: 90%;
            }
            
            .input-area {
                padding: 10px;
                gap: 8px;
            }
            
            .input-area input {
                padding: 10px 12px;
                font-size: 0.95em;
                border-radius: 18px;
            }
            
            .input-area button {
                padding: 10px 16px;
                font-size: 0.85em;
                border-radius: 18px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    
    <div id="messages">
        <div class="bubble bot">Hi! Ask me anything about AgriHub.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here...">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        input.value = "";

        // Knowledge base from AgriHub
        const agriData = {
            about: "AgriHub is an Ethiopian digital exchange connecting farmers and buyers directly. Ethiopia's Digital Harvest - Connect directly with local farmers. Get the best prices, support local communities, and eat fresh. For farmers: Connect directly with local Buyers.",
            products: "We offer a wide variety of Ethiopian products including Teff, Red Onions, Organic Coffee, Fresh Garlic, Sidama Coffee, Green Chili, Barley, Ginger Root, Bananas, Avocado, Potatoes, Tomatoes, Black Cumin, Wheat, Papaya, Cabbage, Carrots, Lemons, Chickpeas, Lentils, Peanuts, Mangoes, Maize, Butter (Qibe), Sweet Potato, Sorghum, Strawberries, Green Beans, Linseed, Oranges, Buna (Raw Beans), Hops (Gesho), Red Chili (Berbere), Pineapple, Guava, Faba Beans, Pumpkin, Sesame Seeds, Grapes, Beetroot, Millet, Custard Apple, Leeks, Sunflower Seeds, Eggplant, Oats, Key Sir, Black Pepper, and Apple. Prices range from 12 to 200 ETB per kg depending on the product.",
            signup: "You can register as a Farmer to sell or a Buyer to shop on our Sign Up page.",
            mission: "Our mission is to eliminate middlemen and ensure fair prices for Ethiopian farmers.",
            tutorial: "Before we start our business lets take a tutorial to get familiar with our platform.",
            shopping: "Start shopping by visiting our products page. Add items to your cart and proceed to checkout.",
            selling: "Farmers can start selling by visiting the sell page and listing their products.",
            contact: "Contact us for support. Our team will fix your problems as fast as possible.",
            cart: "Your cart shows the items you've added. You can remove items or proceed to checkout.",
            delivery: "After checkout, provide delivery details to get your fresh products.",
            default: "I'm not sure about that, but AgriHub is here to help with Ethiopian farming!"
        };

        // Use OpenAI API if key is set, else fallback to keyword matching
        const apiKey = 'YOUR_OPENAI_API_KEY'; // Replace with your actual OpenAI API key
        const userLower = text.toLowerCase();
        let reply;

        if (apiKey !== 'YOUR_OPENAI_API_KEY' && apiKey) {
            // Use AI
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            { role: 'system', content: 'You are a helpful assistant for AgriHub, providing information about the platform, products, and services based on the given knowledge base.' },
                            { role: 'user', content: text }
                        ],
                        max_tokens: 150,
                        temperature: 0.7
                    })
                });
                const data = await response.json();
                reply = data.choices[0].message.content.trim();
            } catch (e) {
                reply = "Sorry, I couldn't connect to the AI service. Using basic responses instead.";
                // Fallback to keywords
                reply = getKeywordReply(userLower, agriData);
            }
        } else {
            // Fallback to keyword matching
            reply = getKeywordReply(userLower, agriData);
        }

        addMsg(reply, 'bot');
    }

    function getKeywordReply(userLower, agriData) {
        if (["product", "coffee", "teff", "vegetable", "fruit", "grain", "buy", "shop", "market"].some(word => userLower.includes(word))) {
            return agriData.products;
        } else if (["who", "what", "about", "agrihub", "company", "platform", "ethiopia", "harvest"].some(word => userLower.includes(word))) {
            return agriData.about;
        } else if (["join", "sign up", "account", "register", "farmer", "buyer"].some(word => userLower.includes(word))) {
            return agriData.signup;
        } else if (["mission", "goal", "purpose", "why"].some(word => userLower.includes(word))) {
            return agriData.mission;
        } else if (["tutorial", "start", "begin", "learn"].some(word => userLower.includes(word))) {
            return agriData.tutorial;
        } else if (["shopping", "purchase", "order"].some(word => userLower.includes(word))) {
            return agriData.shopping;
        } else if (["selling", "sell", "list"].some(word => userLower.includes(word))) {
            return agriData.selling;
        } else if (["contact", "help", "support", "problem"].some(word => userLower.includes(word))) {
            return agriData.contact;
        } else if (["cart", "basket"].some(word => userLower.includes(word))) {
            return agriData.cart;
        } else if (["delivery", "shipping", "checkout"].some(word => userLower.includes(word))) {
            return agriData.delivery;
        } else {
            return agriData.default;
        }
    }

    function addMsg(t, type) {
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = t;
        const container = document.getElementById('messages');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
